run_id: fdm-pi05-causal-openarm-o6
run_root_dir: playground/Checkpoints
seed: 42
trackers:
- jsonl
is_debug: false
framework:
  name: Pi05Causal
  model:
    model_path: ${oc.env:PI05_MODEL_PATH,playground/Pretrained_models/pi05_base_pytorch}
    tokenizer_path: ${oc.env:PI05_TOKENIZER_PATH,playground/Pretrained_models/pi05_assets/paligemma_tokenizer.model}
    dtype: bfloat16
    paligemma_variant: gemma_2b
    action_expert_variant: gemma_300m
    vision_variant: So400m/14
    max_token_len: 200
    num_images: 3
    action_ce_weight: 0.0
    subtask_enabled: false
  generation_model:
    vae_path: ${oc.env:WAN_VAE_PATH,playground/Pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth}
    image_size: 256
    scale_factor: 4
    loss_weight: 1.0
  action_model:
    action_dim: 26
    state_dim: 26
    model_action_dim: 32
    action_horizon: 40
    num_inference_steps: 10
datasets:
  vla_data:
    normalization_mode: min_max
    dataset_py: vla_datasets
    disable_state: true
    data_root_dir: /home/asus/datasets
    data_mix: openarm_o6_pourwater
    per_device_batch_size: 1
    split_strategy: episode_ratio
    eval_ratio: 0.02
    split_seed: 42
    eval_per_device_batch_size: 1
    num_workers: 8
    prefetch_factor: 4
    load_all_data_for_training: true
    action_horizon: ${framework.action_model.action_horizon}
    image_size:
    - 224
    - 224
    state_pad_size: 26
    action_pad_size: 26
    image_frame_offsets:
    - -15
    - 0
    - 15
    use_future_frames: false
    future_frame_stride: 1
trainer:
  global_batch_size: 1
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 2000
  eval_interval: 2000
  learning_rate:
    base: 2.5e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 0.0
  freeze_modules: null
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-10
  enable_gradient_checkpointing: false
  enable_compile: true
  resume_from_checkpoint: latest
  save_format: pt
